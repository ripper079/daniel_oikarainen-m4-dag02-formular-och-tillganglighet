<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boka bord – Kafé Kardemumma</title>
  </head>
  <body>
    <header>
      <h1>Kafé Kardemumma</h1>
      <nav aria-label="Huvudmeny">
        <ul>
          <li><a href="index.html">Startsida</a></li>
          <li><a href="index.html#meny">Meny</a></li>
          <li><a href="kontakt.html" aria-current="page">Boka bord</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h2>Boka bord</h2>
      <p>
        Fyll i formuläret så bekräftar vi din bokning inom ett dygn. Fält
        markerade med * är obligatoriska.
      </p>
      <!-- Namn -->
      <form action="#" method="post">
        <div class="falt">
          <label for="namn">Namn</label>
          <input
            type="text"
            id="namn"
            name="namn"
            required
            autocomplete="name"
          />
        </div>
        <!-- E-Mejl -->
        <div class="falt">
          <label for="email">E-Mail</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            autocomplete="email"
          />
        </div>
        <!-- Telefonnummer-->
        <div class="falt">
          <label for="phone">Telefon</label>
          <input type="tel" id="phone" name="phone" autocomplete="tel" />
        </div>
        <!-- Kalender -->
        <div class="falt">
          <label for="date">Datum</label>
          <input type="date" id="date" name="date" required />
        </div>

        <!-- Rullista för att välja antal personer -->
        <div class="falt">
          <label for="antal_personer">Antal Personer</label>
          <select id="antal_personer" name="antal_personer" required>
            <option value="" disabled selected>Välj antal personer</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
          </select>
        </div>
        <!-- Önskemål (Textfält)  -->
        <div class="falt">
          <label for="onskemal">Önskemål</label>
          <textarea id="onskemal" name="onskemal" rows="4" required> </textarea>
        </div>
        <!-- TODO 2: rullista för antal personer, textarea för önskemål -->
        <!-- TODO 3: fieldset + legend för kostönskemål och bekräftelsesätt -->
        <!-- TODO 4: samtyckeskryssruta (required) och skickaknapp -->
      </form>
    </main>

    <footer>
      <p>&copy; 2026 Kafé Kardemumma</p>
      <address>
        Fiktivgatan 1, 111 11 Stockholm<br />
        <a href="mailto:hej@kardemumma.example">hej@kardemumma.example</a>
      </address>
    </footer>
  </body>
</html>
